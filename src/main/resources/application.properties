spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
spring.threads.virtual.enabled=true

# Public read-only MongoDB connection
spring.data.mongodb.uri=${MONGODB_PUBLIC_URI}

# Admin read/write MongoDB connection
spring.data.mongodb.admin-uri=${MONGODB_ADMIN_URI}

# Database name
spring.data.mongodb.database=cms

# HTTP Basic Auth credentials for write access
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}

# SSL/TLS Configuration (HTTPS)
# Azure (and most PaaS) terminates TLS upstream; your app should usually run HTTP internally.
# Also prefer the platform-provided PORT if present.
server.port=${PORT:${SERVER_PORT:8080}}
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=portfolio-cms