# Use a local MongoDB instance for tests.
# Prefer setting credentials via env vars so they don't get committed.
# Example:
#   export MONGODB_TEST_URI='mongodb://test_user:test_pass@localhost:27017/test?authSource=admin'

# These two properties are used by your custom MongoDBConfiguration.
# Defaults include short timeouts so failures are fast/obvious when Mongo isn't reachable.
spring.data.mongodb.uri=${MONGODB_TEST_URI:mongodb://localhost:27017/test?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
spring.data.mongodb.admin-uri=${MONGODB_TEST_ADMIN_URI:${MONGODB_TEST_URI:mongodb://localhost:27017/test?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}}

# Database name (used by PublicMongoConfig/AdminMongoConfig for MongoTemplate)
# If your URI points at a DB (e.g. .../test_cms), set MONGODB_TEST_DB to match.
spring.data.mongodb.database=${MONGODB_TEST_DB:test_cms}

# Disable SSL for tests
server.ssl.enabled=false
server.port=0

# Basic auth (not used in these tests)
app.admin.username=admin
app.admin.password=password

